<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
      color: #101A4A;
      line-height: 1.7;
    }
    a { color: #1453A0; } a:hover { color: #2064B4; }
    h1, h2, h3 { margin: 0; line-height: 1.3; }
    p { margin: 0; }
    .card { padding: 16px; background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; box-shadow: 0 1px 2px rgba(16, 26, 74, .10); }
    .plate { display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: #1453A0; background: linear-gradient(135deg, #E7EEFA 0%, #F0E6EE 100%); border: 1px solid #DCE5F2; }
  </style>
</helmet>

<div style="width: 375px; background: radial-gradient(circle at 85% 10%, rgb(230 200 212 / 55%) 0%, rgb(230 200 212 / 0%) 34%), linear-gradient(145deg, #F8FAFD 0%, #EAF0FA 55%, #D8E3F4 100%);">

  <!-- Header：窄畫面只顯示方形徽章 + 站名，橫式 Logo 隱藏 -->
  <header style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; background: radial-gradient(120% 200% at 98% -40%, rgb(230 200 212 / 62%) 0%, rgb(230 200 212 / 0%) 58%), linear-gradient(115deg, #1B2F63 0%, #1453A0 46%, #2064B4 72%, #2E6BAE 88%, #E6C8D4 100%); border-bottom: 1px solid #1B2F63;">
    <span style="display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 2px; background: #FFFFFF; border-radius: 999px; overflow: hidden;">
      <img src="badge.png" alt="DoSelect 懂選" style="display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 999px;">
    </span>
    <span style="font-size: 18px; font-weight: 700; color: #FFFFFF;">DoSelect 懂選</span>
    <span style="margin-left: auto; padding: 6px 12px; border: 1px solid #FFFFFF; border-radius: 6px; font-size: 13px; font-weight: 700; color: #FFFFFF;">選單</span>
  </header>

  <main style="padding: 16px;">

    <!-- Hero：375px 隱藏吉祥物裝飾，CTA 完整可見 -->
    <section style="padding: 24px 20px; border: 1px solid #DCE5F2; border-radius: 16px; background: linear-gradient(135deg, #F7F9FD 0%, #E7EEFA 32%, #C8D8F0 58%, #E6C8D4 100%); box-shadow: 0 8px 28px rgba(16, 26, 74, .16);">
      <h1 style="font-size: 28px; font-weight: 700; color: #101A4A; margin-bottom: 10px;">說出需求，組出適合你的電腦</h1>
      <p style="font-size: 16px; color: #4A5A78; margin-bottom: 20px; text-wrap: pretty;">不用先懂規格。回答「要拿來做什麼」和「預算多少」，我們幫你篩掉不合適的。</p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 6px; background: #1453A0; color: #FFFFFF; font-size: 16px; font-weight: 700;">依用途挑選</span>
        <span style="display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 6px; background: #FFFFFF; color: #1453A0; border: 1px solid #1453A0; font-size: 16px; font-weight: 700;">依預算挑選</span>
        <span style="align-self: center; font-size: 16px; color: #1453A0; text-decoration: underline;">看全部商品</span>
      </div>
    </section>

    <!-- 三步驟：375px 圖示不擠壓標題 -->
    <section style="margin-top: 24px;">
      <h2 style="font-size: 22px; font-weight: 700;">三步驟就好</h2>
      <p style="font-size: 13px; color: #4A5A78; margin-top: 4px; margin-bottom: 12px;">每一步只做一個決定，不需要背規格名稱。</p>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div class="card">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">
            <span class="plate" style="width: 48px; height: 48px;"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"></path><path d="M12 7.5a4.5 4.5 0 1 0 4.5 4.5"></path><path d="M12 12 20.5 3.5"></path><path d="M17.5 3.5h3v3"></path></svg></span>
            <span style="padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #101A4A; background: #E4FBF6; border: 1px solid #A6FDEB;">第 1 步</span>
          </div>
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">說用途</h3>
          <p style="font-size: 13px; color: #4A5A78;">打電動、剪片、還是文書上網？我們把用途換算成需要的規格。</p>
        </div>
        <div class="card">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">
            <span class="plate" style="width: 48px; height: 48px;"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H17a1 1 0 0 1 1 1v1.5"></path><path d="M4 7.5v9A2.5 2.5 0 0 0 6.5 19H18a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2H6.5"></path><path d="M16.5 13.5h.01"></path></svg></span>
            <span style="padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #101A4A; background: #E4FBF6; border: 1px solid #A6FDEB;">第 2 步</span>
          </div>
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">給預算</h3>
          <p style="font-size: 13px; color: #4A5A78;">設定金額上限，只看買得起的組合，不會挑到超出預算的。</p>
        </div>
      </div>
    </section>

    <!-- 分類：單欄堆疊 -->
    <section style="margin-top: 24px;">
      <h2 style="font-size: 22px; font-weight: 700;">看看你需要哪一類</h2>
      <p style="font-size: 13px; color: #4A5A78; margin-top: 4px; margin-bottom: 12px;">用分類快速找到方向，不確定也沒關係。</p>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div class="card">
          <span class="plate" style="width: 38px; height: 38px; margin-bottom: 8px;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"></path><path d="M9 7h6"></path><path d="M9 10.5h6"></path><path d="M9.5 17h1.5"></path></svg></span>
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">桌上型電腦</h3>
          <p style="font-size: 13px; color: #4A5A78;">整台組好，插電就能用</p>
        </div>
        <div class="card">
          <span class="plate" style="width: 38px; height: 38px; margin-bottom: 8px;"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6.5A1.5 1.5 0 0 1 7.5 5h9A1.5 1.5 0 0 1 18 6.5v8H6z"></path><path d="M3.5 14.5h17l-1 3a1.5 1.5 0 0 1-1.4 1H5.9a1.5 1.5 0 0 1-1.4-1z"></path></svg></span>
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">筆記型電腦</h3>
          <p style="font-size: 13px; color: #4A5A78;">帶著走，上課上班都行</p>
        </div>
      </div>
    </section>
  </main>

  <footer style="margin-top: 8px; padding: 20px 16px; text-align: center; background: linear-gradient(115deg, #1B2F63 0%, #24407E 52%, #2E6BAE 84%, #E6C8D4 100%);">
    <p style="font-size: 16px; font-weight: 700; color: #FFFFFF;">DoSelect 懂選</p>
    <p style="font-size: 13px; color: #C8D8F0;">畢業專題展示系統</p>
  </footer>

</div>
</x-dc>
</body>
</html>
