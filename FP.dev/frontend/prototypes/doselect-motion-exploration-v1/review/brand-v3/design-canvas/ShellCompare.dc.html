<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
      color: #101A4A;
      line-height: 1.7;
    }
    a { color: #1453A0; } a:hover { color: #2064B4; }
    h2, h3 { margin: 0; line-height: 1.3; }
    p { margin: 0; }
    code { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace; font-size: 12px; }
  </style>
</helmet>

<div style="width: 900px; padding: 28px; background: #F7F9FD;">
  <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 4px;">大型深藍調淡：brand-v2 → brand-v3</h2>
  <p style="font-size: 13px; color: #4A5A78; margin-bottom: 20px;">只有大面積殼層提亮；內文、主要按鈕、focus ring 與 Logo 原色維持不變。</p>

  <div style="display: flex; flex-direction: column; gap: 20px;">

    <!-- Header -->
    <div>
      <h3 style="font-size: 13px; font-weight: 700; color: #4A5A78; margin-bottom: 6px;">Header 殼層漸層</h3>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <div>
          <div style="height: 56px; border-radius: 10px; background: linear-gradient(115deg, #101A4A 0%, #043A91 46%, #155799 72%, #2E6BAE 88%, #E6C8D4 100%); display: flex; align-items: center; padding: 0 14px;">
            <span style="font-size: 13px; font-weight: 700; color: #FFFFFF;">v2　白字 16.55:1</span>
          </div>
          <p style="font-size: 12px; color: #4A5A78; margin-top: 6px;"><code>#101A4A → #043A91 → #155799</code></p>
        </div>
        <div>
          <div style="height: 56px; border-radius: 10px; background: linear-gradient(115deg, #1B2F63 0%, #1453A0 46%, #2064B4 72%, #2E6BAE 88%, #E6C8D4 100%); display: flex; align-items: center; padding: 0 14px;">
            <span style="font-size: 13px; font-weight: 700; color: #FFFFFF;">v3　白字 12.86:1</span>
          </div>
          <p style="font-size: 12px; color: #4A5A78; margin-top: 6px;"><code>#1B2F63 → #1453A0 → #2064B4</code></p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div>
      <h3 style="font-size: 13px; font-weight: 700; color: #4A5A78; margin-bottom: 6px;">Footer 漸層</h3>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <div style="height: 48px; border-radius: 10px; background: linear-gradient(115deg, #101A4A 0%, #16255C 52%, #2E6BAE 84%, #E6C8D4 100%); display: flex; align-items: center; padding: 0 14px;">
          <span style="font-size: 13px; font-weight: 700; color: #FFFFFF;">v2</span>
        </div>
        <div style="height: 48px; border-radius: 10px; background: linear-gradient(115deg, #1B2F63 0%, #24407E 52%, #2E6BAE 84%, #E6C8D4 100%); display: flex; align-items: center; padding: 0 14px;">
          <span style="font-size: 13px; font-weight: 700; color: #FFFFFF;">v3</span>
        </div>
      </div>
    </div>

    <!-- 登入背景 -->
    <div>
      <h3 style="font-size: 13px; font-weight: 700; color: #4A5A78; margin-bottom: 6px;">登入／2FA 背景</h3>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <div style="height: 72px; border-radius: 10px; background: radial-gradient(circle at 80% 16%, rgb(230 200 212 / 58%) 0%, rgb(230 200 212 / 0%) 44%), linear-gradient(140deg, #101A4A 0%, #043A91 46%, #2E6BAE 78%, #C8D8F0 100%);"></div>
        <div style="height: 72px; border-radius: 10px; background: radial-gradient(circle at 80% 16%, rgb(230 200 212 / 58%) 0%, rgb(230 200 212 / 0%) 44%), linear-gradient(140deg, #1B2F63 0%, #1453A0 46%, #2E6BAE 78%, #C8D8F0 100%);"></div>
      </div>
    </div>

    <!-- 不隨之變淡的項目 -->
    <div>
      <h3 style="font-size: 13px; font-weight: 700; color: #4A5A78; margin-bottom: 6px;">刻意不調淡（v2 = v3）</h3>
      <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; font-size: 13px;">
          <span style="width: 16px; height: 16px; border-radius: 4px; background: #101A4A;"></span>內文 <code>#101A4A</code> 15.70:1
        </span>
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; font-size: 13px;">
          <span style="width: 16px; height: 16px; border-radius: 4px; background: #1453A0;"></span>主要按鈕 <code>#1453A0</code> 7.57:1
        </span>
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; font-size: 13px;">
          <span style="width: 16px; height: 16px; border-radius: 4px; border: 2px solid #1453A0;"></span>focus ring
        </span>
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; font-size: 13px;">
          <span style="width: 16px; height: 16px; border-radius: 4px; background: #A32B33;"></span>狀態語意色
        </span>
        <span style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; font-size: 13px;">
          <span style="width: 16px; height: 16px; border-radius: 4px; background: #E6C8D4;"></span>粉色襯色 <code>#E6C8D4</code>
        </span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
