name: Discord GitHub Event Notification

on:
  push:
    branches:
      - "**"

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
      - ready_for_review

  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened

  issue_comment:
    types:
      - created
      - edited

  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-discord:
    name: Notify Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send GitHub event notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Repository secret DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            COMMIT_MSG=$(jq -r '.head_commit.message // "No commit message"' "$GITHUB_EVENT_PATH")
            COMMIT_URL=$(jq -r '.head_commit.url // ""' "$GITHUB_EVENT_PATH")

            MESSAGE="📌 **GitHub Push Event**
          **Repo：** $REPOSITORY
          **作者：** $ACTOR
          **分支：** $REF_NAME
          **Commit：** $COMMIT_MSG
          **連結：** $COMMIT_URL"

          elif [ "$EVENT_NAME" = "pull_request" ]; then
            ACTION=$(jq -r '.action' "$GITHUB_EVENT_PATH")
            PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
            PR_TITLE=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
            PR_URL=$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")
            PR_MERGED=$(jq -r '.pull_request.merged' "$GITHUB_EVENT_PATH")
            BASE_BRANCH=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
            HEAD_BRANCH=$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")

            if [ "$ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
              STATUS="merged"
              EMOJI="✅"
            elif [ "$ACTION" = "closed" ]; then
              STATUS="closed"
              EMOJI="🚫"
            elif [ "$ACTION" = "opened" ]; then
              STATUS="opened"
              EMOJI="🆕"
            elif [ "$ACTION" = "synchronize" ]; then
              STATUS="updated with new commits"
              EMOJI="🔄"
            elif [ "$ACTION" = "reopened" ]; then
              STATUS="reopened"
              EMOJI="♻️"
            elif [ "$ACTION" = "ready_for_review" ]; then
              STATUS="ready for review"
              EMOJI="👀"
            else
              STATUS="$ACTION"
              EMOJI="📌"
            fi

            MESSAGE="$EMOJI **GitHub PR Event**
          **Repo：** $REPOSITORY
          **PR：** #$PR_NUMBER $PR_TITLE
          **狀態：** $STATUS
          **操作者：** $ACTOR
          **分支：** $HEAD_BRANCH → $BASE_BRANCH
          **連結：** $PR_URL"

          elif [ "$EVENT_NAME" = "issues" ]; then
            ACTION=$(jq -r '.action' "$GITHUB_EVENT_PATH")
            ISSUE_NUMBER=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
            ISSUE_TITLE=$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")
            ISSUE_URL=$(jq -r '.issue.html_url' "$GITHUB_EVENT_PATH")
            ISSUE_STATE=$(jq -r '.issue.state' "$GITHUB_EVENT_PATH")
            ISSUE_AUTHOR=$(jq -r '.issue.user.login' "$GITHUB_EVENT_PATH")

            ASSIGNEES=$(jq -r '
              if (.issue.assignees | length) == 0 then
                "未指派"
              else
                [.issue.assignees[].login] | join(", ")
              end
            ' "$GITHUB_EVENT_PATH")

            LABELS=$(jq -r '
              if (.issue.labels | length) == 0 then
                "無 label"
              else
                [.issue.labels[].name] | join(", ")
              end
            ' "$GITHUB_EVENT_PATH")

            if [ "$ACTION" = "opened" ]; then
              STATUS="opened"
              EMOJI="🆕"
            elif [ "$ACTION" = "edited" ]; then
              STATUS="edited"
              EMOJI="✏️"
            elif [ "$ACTION" = "assigned" ]; then
              STATUS="assigned"
              EMOJI="👤"
            elif [ "$ACTION" = "unassigned" ]; then
              STATUS="unassigned"
              EMOJI="👤"
            elif [ "$ACTION" = "labeled" ]; then
              LABEL_NAME=$(jq -r '.label.name // ""' "$GITHUB_EVENT_PATH")
              STATUS="labeled：$LABEL_NAME"
              EMOJI="🏷️"
            elif [ "$ACTION" = "unlabeled" ]; then
              LABEL_NAME=$(jq -r '.label.name // ""' "$GITHUB_EVENT_PATH")
              STATUS="unlabeled：$LABEL_NAME"
              EMOJI="🏷️"
            elif [ "$ACTION" = "closed" ]; then
              STATUS="closed"
              EMOJI="✅"
            elif [ "$ACTION" = "reopened" ]; then
              STATUS="reopened"
              EMOJI="♻️"
            else
              STATUS="$ACTION"
              EMOJI="📌"
            fi

            MESSAGE="$EMOJI **GitHub Issue Event**
          **Repo：** $REPOSITORY
          **Issue：** #$ISSUE_NUMBER $ISSUE_TITLE
          **狀態：** $STATUS
          **Issue 狀態：** $ISSUE_STATE
          **建立者：** $ISSUE_AUTHOR
          **操作者：** $ACTOR
          **負責人：** $ASSIGNEES
          **Label：** $LABELS
          **連結：** $ISSUE_URL"

          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            ACTION=$(jq -r '.action' "$GITHUB_EVENT_PATH")
            ISSUE_NUMBER=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
            ISSUE_TITLE=$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")
            COMMENT_URL=$(jq -r '.comment.html_url' "$GITHUB_EVENT_PATH")
            COMMENT_AUTHOR=$(jq -r '.comment.user.login' "$GITHUB_EVENT_PATH")
            COMMENT_PREVIEW=$(jq -r '(.comment.body // "")[0:500]' "$GITHUB_EVENT_PATH")

            if jq -e '.issue.pull_request' "$GITHUB_EVENT_PATH" > /dev/null; then
              TARGET_TYPE="PR"
            else
              TARGET_TYPE="Issue"
            fi

            if [ "$ACTION" = "created" ]; then
              STATUS="comment created"
              EMOJI="💬"
            elif [ "$ACTION" = "edited" ]; then
              STATUS="comment edited"
              EMOJI="✏️"
            else
              STATUS="$ACTION"
              EMOJI="💬"
            fi

            MESSAGE="$EMOJI **GitHub $TARGET_TYPE Comment Event**
          **Repo：** $REPOSITORY
          **$TARGET_TYPE：** #$ISSUE_NUMBER $ISSUE_TITLE
          **狀態：** $STATUS
          **留言者：** $COMMENT_AUTHOR
          **操作者：** $ACTOR
          **留言預覽：**
          $COMMENT_PREVIEW
          **連結：** $COMMENT_URL"

          else
            MESSAGE="📌 **GitHub Event Notification Test**
          **Repo：** $REPOSITORY
          **事件：** $EVENT_NAME
          **操作者：** $ACTOR"
          fi

          MESSAGE=${MESSAGE:0:1900}

          jq -n --arg content "$MESSAGE" \
            '{content: $content, allowed_mentions: {parse: []}}' > payload.json

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -X POST \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
