name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  ai-evaluation-contract:
    name: AI Evaluation Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: FP.dev/.nvmrc

      - name: Verify generated evaluation artifacts are current
        run: node scripts/build-ai-eval-dataset.mjs --check
        working-directory: FP.dev

      - name: Validate evaluation dataset contract
        run: node scripts/validate-ai-eval-dataset.mjs
        working-directory: FP.dev

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FP.dev
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiOnly_P@ssw0rd2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CiOnly_P@ssw0rd2026 -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=DoSelectDb;User Id=sa;Password=CiOnly_P@ssw0rd2026;TrustServerCertificate=True;MultipleActiveResultSets=True;"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: FP.dev/global.json

      - name: Restore with warnings as errors
        run: dotnet restore DoSelect.slnx -warnaserror

      - name: Build with warnings as errors
        run: dotnet build DoSelect.slnx --no-restore -warnaserror

      - name: Verify formatting
        run: dotnet format DoSelect.slnx --verify-no-changes --no-restore

      - name: Install EF Core CLI tool
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Apply database migrations
        run: >-
          "$HOME/.dotnet/tools/dotnet-ef" database update
          --project src/backend/DoSelect.Infrastructure
          --startup-project src/backend/DoSelect.Api
          --no-build

      - name: Run .NET tests
        # DEV-07: SQL Server Provider-backed integration tests need a live SQL Server
        # (no Docker/SQL runner is authorized for this required Linux CI yet), so they're
        # excluded here via Category=RequiresSqlServer and still run locally/on a
        # SQL-Server-capable machine with a plain `dotnet test` (no filter).
        run: dotnet test DoSelect.slnx --no-build --no-restore --filter "Category!=RequiresSqlServer"

      - name: Report vulnerable NuGet packages
        run: dotnet list DoSelect.slnx package --vulnerable --include-transitive

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-web
          - admin-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: FP.dev/.nvmrc
          cache: npm
          cache-dependency-path: FP.dev/frontend/${{ matrix.app }}/package-lock.json

      - name: Install locked dependencies
        run: npm ci
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Type-check
        run: npm run typecheck
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings 0
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Run frontend tests
        run: npm test
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Build production assets
        run: npm run build
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: FP.dev/frontend/${{ matrix.app }}

  required:
    name: CI Required
    if: ${{ always() }}
    needs:
      - ai-evaluation-contract
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all required jobs succeeded
        env:
          AI_EVAL_RESULT: ${{ needs.ai-evaluation-contract.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$AI_EVAL_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
