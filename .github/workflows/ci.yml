name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan complete Git history for secrets
        run: /tmp/gitleaks git --redact --no-banner --verbose .

  ai-evaluation-contract:
    name: AI Evaluation Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: FP.dev/.nvmrc

      - name: Verify generated evaluation artifacts are current
        run: node scripts/build-ai-eval-dataset.mjs --check
        working-directory: FP.dev

      - name: Validate evaluation dataset contract
        run: node scripts/validate-ai-eval-dataset.mjs
        working-directory: FP.dev

  package-source-evidence:
    name: Package Source Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify package source policy
        shell: pwsh
        run: ./scripts/verify-package-sources.ps1
        working-directory: FP.dev

      - name: Verify source-policy rejection paths
        shell: pwsh
        run: ./scripts/test-package-source-verifier.ps1
        working-directory: FP.dev

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FP.dev
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiOnly_P@ssw0rd2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CiOnly_P@ssw0rd2026 -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=DoSelectDb;User Id=sa;Password=CiOnly_P@ssw0rd2026;TrustServerCertificate=True;MultipleActiveResultSets=True;"
      DOSELECT_SQLSERVER_TEST_CONNECTION: "Server=localhost,1433;Database=DoSelectDb;User Id=sa;Password=CiOnly_P@ssw0rd2026;TrustServerCertificate=True;MultipleActiveResultSets=True;"
      GuestOrderAccess__Pepper: "ci-only-guest-order-access-pepper-32-bytes"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: FP.dev/global.json

      - name: Restore with warnings as errors
        run: dotnet restore DoSelect.slnx --configfile NuGet.config --no-cache -warnaserror

      - name: Build with warnings as errors
        run: dotnet build DoSelect.slnx --no-restore -warnaserror

      - name: Verify formatting
        run: dotnet format DoSelect.slnx --verify-no-changes --no-restore

      - name: Install EF Core CLI tool
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Apply database migrations
        run: >-
          "$HOME/.dotnet/tools/dotnet-ef" database update
          --project src/backend/DoSelect.Infrastructure
          --startup-project src/backend/DoSelect.Api
          --no-build

      - name: Set up Node.js for OpenAPI contract check
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: FP.dev/.nvmrc
          cache: npm
          cache-dependency-path: FP.dev/frontend/customer-web/package-lock.json

      - name: Install OpenAPI generator dependencies
        run: npm ci
        working-directory: FP.dev/frontend/customer-web

      - name: Verify committed OpenAPI client is current
        shell: bash
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5126 dotnet run \
            --project src/backend/DoSelect.Api/DoSelect.Api.csproj --no-build \
            > "$RUNNER_TEMP/doselect-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5126/openapi/v1.json > /dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/doselect-api.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5126/openapi/v1.json > /dev/null
          npm run api:check --prefix frontend/customer-web

      - name: Run non-timing .NET tests
        # The Backend job already provisions SQL Server, applies migrations, and exposes the
        # same connection string to the test host. Keep provider-backed authorization and
        # persistence tests inside the Required gate instead of silently filtering them out.
        # TimingSideChannelTests run in the next step so solution-level test-project concurrency
        # cannot distort their finalized 20ms latency threshold.
        run: >-
          dotnet test DoSelect.slnx --no-build --no-restore
          --filter "FullyQualifiedName!~DoSelect.Api.IntegrationTests.TimingSideChannelTests"
          --collect:"XPlat Code Coverage"
          --results-directory .coverage/backend

      - name: Run timing side-channel tests without competing test projects
        run: >-
          dotnet test tests/DoSelect.Api.IntegrationTests/DoSelect.Api.IntegrationTests.csproj
          --no-build --no-restore
          --filter "FullyQualifiedName~DoSelect.Api.IntegrationTests.TimingSideChannelTests"
          --collect:"XPlat Code Coverage"
          --results-directory .coverage/backend

      - name: Enforce Domain and Application coverage
        shell: pwsh
        run: ./scripts/verify-backend-coverage.ps1 -CoverageRoot .coverage/backend -MinimumLineRate 70

      - name: Report vulnerable NuGet packages
        run: dotnet list DoSelect.slnx package --vulnerable --include-transitive

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-web
          - admin-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: FP.dev/.nvmrc
          cache: npm
          cache-dependency-path: FP.dev/frontend/${{ matrix.app }}/package-lock.json

      - name: Install locked dependencies
        run: npm ci
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Type-check
        run: npm run typecheck
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings 0
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Run frontend tests and enforce core coverage
        run: npm run test:coverage
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Build production assets
        run: npm run build
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp gitleaks

      - name: Scan production assets for secrets
        run: /tmp/gitleaks dir --redact --no-banner dist
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: FP.dev/frontend/${{ matrix.app }}

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiOnly_P@ssw0rd2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CiOnly_P@ssw0rd2026 -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=DoSelectE2e;User Id=sa;Password=CiOnly_P@ssw0rd2026;TrustServerCertificate=True;MultipleActiveResultSets=True;"
      GuestOrderAccess__Pepper: "ci-only-guest-order-access-pepper-32-bytes"
      Seed__AdminPassword: "E2e_Admin_123!"
      Seed__MemberPassword: "E2e_Member_123!"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: FP.dev/global.json

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: FP.dev/.nvmrc
          cache: npm
          cache-dependency-path: |
            FP.dev/frontend/customer-web/package-lock.json
            FP.dev/frontend/admin-web/package-lock.json

      - name: Restore and build API
        run: |
          dotnet restore DoSelect.slnx --configfile NuGet.config --no-cache -warnaserror
          dotnet build DoSelect.slnx --no-restore -warnaserror
        working-directory: FP.dev

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend/customer-web
          npm ci --prefix frontend/admin-web
        working-directory: FP.dev

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: FP.dev/frontend/customer-web

      - name: Prepare disposable E2E database
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          "$HOME/.dotnet/tools/dotnet-ef" database update \
            --project src/backend/DoSelect.Infrastructure \
            --startup-project src/backend/DoSelect.Api \
            --no-build
          dotnet run --project src/backend/DoSelect.Api --no-build --no-launch-profile -- --seed-minimal
        working-directory: FP.dev

      - name: Ensure sqlcmd is on PATH
        # customer.spec.ts's e2e/sqlAssert.ts shells out to `sqlcmd` for direct SQL assertions
        # against the isolated E2E database — that's the runner host talking to the sqlserver
        # service container over localhost:1433, not a command run inside the container, so the
        # container image's own /opt/mssql-tools18/bin/sqlcmd (used by the health-check above)
        # doesn't help here. Prefer whatever the runner image already ships, and only fall back to
        # installing mssql-tools18 via apt if neither known path is present.
        run: |
          if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
            echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then
            echo "/opt/mssql-tools/bin" >> "$GITHUB_PATH"
          else
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
            UBUNTU_VERSION="$(lsb_release -rs)"
            curl -sSL "https://packages.microsoft.com/config/ubuntu/${UBUNTU_VERSION}/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
            echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
          fi

      - name: Run browser journeys
        run: npm run test:e2e
        working-directory: FP.dev/frontend/customer-web

      - name: Upload Playwright failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            FP.dev/frontend/customer-web/playwright-report
            FP.dev/frontend/customer-web/test-results
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: CI Required
    if: ${{ always() }}
    needs:
      - secret-scan
      - ai-evaluation-contract
      - package-source-evidence
      - backend
      - frontend
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all required jobs succeeded
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          AI_EVAL_RESULT: ${{ needs.ai-evaluation-contract.result }}
          PACKAGE_SOURCE_RESULT: ${{ needs.package-source-evidence.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$SECRET_SCAN_RESULT" = "success"
          test "$AI_EVAL_RESULT" = "success"
          test "$PACKAGE_SOURCE_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$E2E_RESULT" = "success"
