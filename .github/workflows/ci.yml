name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan complete Git history for secrets
        run: /tmp/gitleaks git --redact --no-banner --verbose .

  ai-evaluation-contract:
    name: AI Evaluation Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: FP.dev/.nvmrc

      - name: Verify generated evaluation artifacts are current
        run: node scripts/build-ai-eval-dataset.mjs --check
        working-directory: FP.dev

      - name: Validate evaluation dataset contract
        run: node scripts/validate-ai-eval-dataset.mjs
        working-directory: FP.dev

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FP.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: FP.dev/global.json

      - name: Restore with warnings as errors
        run: dotnet restore DoSelect.slnx -warnaserror

      - name: Build with warnings as errors
        run: dotnet build DoSelect.slnx --no-restore -warnaserror

      - name: Verify formatting
        run: dotnet format DoSelect.slnx --verify-no-changes --no-restore

      - name: Run .NET tests
        # DEV-07: SQL Server Provider-backed integration tests need a live SQL Server
        # (no Docker/SQL runner is authorized for this required Linux CI yet), so they're
        # excluded here via Category=RequiresSqlServer and still run locally/on a
        # SQL-Server-capable machine with a plain `dotnet test` (no filter).
        run: dotnet test DoSelect.slnx --no-build --no-restore --filter "Category!=RequiresSqlServer"

      - name: Report vulnerable NuGet packages
        run: dotnet list DoSelect.slnx package --vulnerable --include-transitive

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-web
          - admin-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: FP.dev/.nvmrc
          cache: npm
          cache-dependency-path: FP.dev/frontend/${{ matrix.app }}/package-lock.json

      - name: Install locked dependencies
        run: npm ci
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Type-check
        run: npm run typecheck
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Lint with zero warnings
        run: npm run lint -- --max-warnings 0
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Run frontend tests
        run: npm test
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Build production assets
        run: npm run build
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp gitleaks

      - name: Scan production assets for secrets
        run: /tmp/gitleaks dir --redact --no-banner dist
        working-directory: FP.dev/frontend/${{ matrix.app }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: FP.dev/frontend/${{ matrix.app }}

  required:
    name: CI Required
    if: ${{ always() }}
    needs:
      - secret-scan
      - ai-evaluation-contract
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all required jobs succeeded
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          AI_EVAL_RESULT: ${{ needs.ai-evaluation-contract.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$SECRET_SCAN_RESULT" = "success"
          test "$AI_EVAL_RESULT" = "success"
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
